<style>
:root {
  --primary: #667eea; --primary-hover: #5a67d8; --primary-light: #e0e7ff; --secondary: #764ba2;

  --shadow-hover: 0 20px 40px rgba(102, 126, 234, 0.15);

}
body.dark {
  --primary-light: #1e1b4b; --card-bg: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155;

}

body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--text); line-height: 1.6; min-height: 100vh; transition: var(--transition); }
.container { max-width: 1100px; margin: 0 auto; padding: 20px; }

.top-nav { background: rgba(var(--card-bg), 0.8); backdrop-filter: blur(12px); padding: 16px 24px; border-radius: 100px; margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 16px; z-index: 1000; flex-wrap: wrap; gap: 10px; }
.nav-links { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 14px; padding: 8px 20px; border-radius: 50px; transition: var(--transition); }
.nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }
.theme-toggle-btn { background: var(--card-bg); border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 50%; color: var(--text); cursor: pointer; transition: var(--transition); }

.international-bar { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; background: var(--card-bg); padding: 16px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.region-selector select { padding: 10px 20px; border: 2px solid var(--border); border-radius: 50px; font-size: 14px; font-weight: 600; background: var(--card-bg); color: var(--text); cursor: pointer; outline: none; }
.unit-toggle { display: flex; gap: 8px; align-items: center; }
.unit-btn { padding: 8px 16px; border: 2px solid var(--border); border-radius: 50px; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--card-bg); color: var(--text-muted); transition: var(--transition); }

.hero { text-align: center; padding: 30px 20px 40px; }
.hero h1 { font-size: clamp(26px, 5vw, 42px); font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; margin-bottom: 12px; }

.result-box { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: var(--radius-xl); padding: 32px; color: white; text-align: center; border: 2px solid transparent; transition: all 0.4s; position: relative; }
.medically-reviewed-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(16,185,129,0.15); color: #6ee7b7; padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 700; margin-bottom: 20px; border: 1px solid rgba(16,185,129,0.3); }

.bac-scale { margin: 24px 0; padding: 20px; background: rgba(255,255,255,0.05); border-radius: var(--radius-lg); }

.scale-labels { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.8; font-weight: 600; }

.sober-time { background: rgba(255,255,255,0.1); padding: 16px; border-radius: var(--radius-md); margin-top: 16px; font-size: 15px; font-weight: 600; }
.sober-time-clock { font-size: 13px; opacity: 0.9; margin-top: 4px; font-weight: 500; }
.safety-message { margin-top: 16px; padding: 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 700; }
.safety-message.critical { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
.safety-message.safe { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
.safety-message.emergency { background: rgba(239,68,68,0.35); color: white; border: 2px solid #ef4444; }

.legal-limits { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 24px 0; }
.legal-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: var(--radius-md); font-size: 12px; color: white; border: 1px solid rgba(255,255,255,0.1); }
.legal-card.selected { border: 2px solid #fbbf24; background: rgba(251,191,36,0.15); }

.chart-container { background: rgba(255,255,255,0.05); border-radius: var(--radius-lg); padding: 16px; margin: 16px 0; height: 220px; }

.action-buttons { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.btn-export { flex: 1; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border); background: white; color: var(--text); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
.btn-export:hover { background: #f1f5f9; }
.btn-share { flex: 1; padding: 14px; border-radius: var(--radius-md); border: none; background: #10b981; color: white; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
.btn-share:hover { background: #059669; }
</style>

<div class="container">
  <nav class="top-nav">
    <div class="nav-links">
      <a href="index.html"><i class="fas fa-home"></i> Home</a>

        <option value="in">🇮🇳 India (0.03%)</option>

      </select>
    </div>

      <button class="unit-btn active" data-unitbac="metric" onclick="setUnit('metric')">Metric (kg)</button>

          <label>Gender</label>
          <select id="gender" onchange="calculateBAC()">
            <option value="male">Male</option>
            <option value="female">Female</option>

        </div>
        <div class="form-group">
          <label>Weight</label>
          <!-- Metric & Imperial inputs -->
          <input type="number" id="weightMetric" value="70" step="0.1" oninput="syncWeight('metric')" style="display:block;">
          <input type="number" id="weightImperial" value="154" step="0.1" oninput="syncWeight('imperial')" style="display:none;">
        </div>
      </div>
      <div class="row-2">

          <label>Hours since first drink</label>
          <input type="number" id="hours" value="1" step="0.5" oninput="calculateBAC()">
        </div>
        <div class="form-group">
          <label>Food Consumed?</label>
          <select id="food" onchange="calculateBAC()">
            <option value="empty">Empty Stomach</option>
            <option value="full" selected>Full Meal</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title"><i class="fas fa-wine-glass-alt"></i> Drinks Consumed</div>
      <div id="drinksContainer">
        <div class="drink-item">
          <select class="drink-type" onchange="calculateBAC()">
            <option value="beer">🍺 Beer (650ml, 5%)</option>
            <option value="old-monk">🥃 Old Monk Rum (60ml, 42.8%)</option>
            <option value="wine">🍷 Wine (150ml, 12%)</option>
            <option value="spirit">🥃 Shot (44ml, 40%)</option>
          </select>

    <div id="pdf-content">

      <button class="btn-export" onclick="exportPDF()"><i class="fas fa-file-pdf" style="color:#ef4444;"></i> Download PDF Report</button>

<script>
var currentUnit = 'metric';
var chartInstance = null;
var countryData = {
  'in': { limit: 0.03, name: 'India (Sec 185 MV Act)' },
  'us': { limit: 0.08, name: 'United States' },
  'uk': { limit: 0.08, name: 'United Kingdom' },
  'ae': { limit: 0.00, name: 'UAE (Zero Tolerance)' }
};
var currentCountry = 'in';

var DRINK_DB = {
  'beer': { v: 650, abv: 0.05 },
  'old-monk': { v: 60, abv: 0.428 },
  'wine': { v: 150, abv: 0.12 },
  'spirit': { v: 44, abv: 0.40 }
};

// --- UNIT SYNC LOGIC ---
function setUnit(unit) {
  currentUnit = unit;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.toggle('active', b.dataset.unitbac === unit));
  
  const metricInp = document.getElementById('weightMetric');
  const impInp = document.getElementById('weightImperial');
  
  if(unit === 'metric') {
    metricInp.style.display = 'block';
    impInp.style.display = 'none';
    impInp.value = (metricInp.value * 2.20462).toFixed(1);
  } else {
    metricInp.style.display = 'none';
    impInp.style.display = 'block';
    metricInp.value = (impInp.value / 2.20462).toFixed(1);
  }
  calculateBAC();
}

function syncWeight(from) {
  const metricInp = document.getElementById('weightMetric');
  const impInp = document.getElementById('weightImperial');
  if(from === 'metric' && metricInp.value) {
    impInp.value = (metricInp.value * 2.20462).toFixed(1);
  } else if(from === 'imperial' && impInp.value) {
    metricInp.value = (impInp.value / 2.20462).toFixed(1);
  }
  calculateBAC();
}

function setCountry(code) {
  currentCountry = code;
  calculateBAC();
}

function addDrink() {
  var div = document.createElement('div');
  div.className = 'drink-item';
  div.innerHTML = `
    <select class="drink-type" onchange="calculateBAC()">
      <option value="beer">🍺 Beer (650ml, 5%)</option>
      <option value="old-monk">🥃 Old Monk Rum (60ml, 42.8%)</option>
      <option value="wine">🍷 Wine (150ml, 12%)</option>
      <option value="spirit">🥃 Shot (44ml, 40%)</option>
    </select>
    <input type="number" class="drink-quantity" value="1" step="0.5" oninput="calculateBAC()">
    <button class="remove-drink" onclick="removeDrink(this)"><i class="fas fa-trash-alt"></i></button>
  `;
  document.getElementById('drinksContainer').appendChild(div);
  calculateBAC();
}

function removeDrink(btn) {
  if(document.querySelectorAll('.drink-item').length > 1) {
    btn.closest('.drink-item').remove();
    calculateBAC();
  }
}

// --- CORE CALCULATION ---
function calculateBAC() {
  var gender = document.getElementById('gender').value;
  var weightKg = parseFloat(document.getElementById('weightMetric').value);
  var hours = parseFloat(document.getElementById('hours').value) || 0;
  
  if(!weightKg || weightKg <= 0) return;

  var totalAlcoholGrams = 0;
  document.querySelectorAll('.drink-item').forEach(item => {
    var type = item.querySelector('.drink-type').value;
    var qty = parseFloat(item.querySelector('.drink-quantity').value) || 0;
    var d = DRINK_DB[type];
    // Grams = Volume(ml) * ABV * Density(0.789) * Qty
    totalAlcoholGrams += (d.v * d.abv * 0.789 * qty);
  });

  var r = gender === 'male' ? 0.68 : 0.55;
  // Widmark Formula
  var peakBAC = (totalAlcoholGrams / (weightKg * r * 10));
  var currentBAC = Math.max(0, peakBAC - (hours * 0.015));

  updateUI(currentBAC);
}

function updateUI(bac) {
  document.getElementById('bacResult').innerText = bac.toFixed(3) + '%';
  document.getElementById('scaleIndicator').style.left = Math.min(bac * 500, 100) + '%';
  
  var limit = countryData[currentCountry].limit;
  var badge = document.getElementById('bacStatusBadge');
  badge.innerHTML = bac >= limit ? '<span class="bac-badge over">🚫 OVER LIMIT</span>' : '<span class="bac-badge legal">✅ LEGAL</span>';

  // Sober Time
  var hoursToSober = bac / 0.015;
  var soberHtml = "";
  if(bac > 0) {
    var h = Math.floor(hoursToSober);
    var m = Math.round((hoursToSober - h) * 60);
    var now = new Date();
    var soberAt = new Date(now.getTime() + hoursToSober * 3600000);
    soberHtml = `🚗 Sober in approx: <strong>${h}h ${m}m</strong>.<br><span style="font-size:13px;opacity:0.8;">(Around ${soberAt.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})})</span>`;
  } else {
    soberHtml = "✅ BAC is zero.";
  }
  document.getElementById('soberTime').innerHTML = soberHtml;

  // Safety Message
  var sm = document.getElementById('safetyMessage');
  if(bac >= 0.25) {
    sm.innerHTML = "🚨 EMERGENCY: High risk of poisoning. Call 112 immediately.";
    sm.className = "safety-message emergency";
  } else if(bac >= limit) {
    sm.innerHTML = "⚠️ WARNING: You are over the legal limit. DO NOT DRIVE.";
    sm.className = "safety-message critical";
  } else if(bac > 0) {
    sm.innerHTML = "⚠️ Any alcohol impairs driving. Use a designated driver.";
    sm.className = "safety-message safe";
  } else {
    sm.innerHTML = "✅ You are sober.";
    sm.className = "safety-message safe";
  }

  renderChart(bac, limit);
}

function renderChart(bac, limit) {
  var ctx = document.getElementById('eliminationChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();

  var dataPoints = [];
  var labels = [];
  for(let i=0; i<=12; i+=1) {
    labels.push(i + 'h');
    dataPoints.push(Math.max(0, bac - (i * 0.015)));
  }

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Your BAC',
        data: dataPoints,
        borderColor: '#fbbf24',
        backgroundColor: 'rgba(251,191,36,0.1)',
        borderWidth: 3,
        fill: true,
        tension: 0.3
      }, {
        label: 'Legal Limit',
        data: Array(13).fill(limit),
        borderColor: '#ef4444',
        borderDash: [5,5],
        borderWidth: 2,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { 
        y: { ticks: { callback: v => v.toFixed(2)+'%' }, max: Math.max(limit*1.5, bac*1.2, 0.05) },
        x: { grid: { display: false } }
      }
    }
  });
}

// --- PREMIUM EXPORT & SHARE ---
function exportPDF() {
  if(document.getElementById('bacResult').innerText === '0.000%') {
    alert('Please calculate your BAC first.'); return;
  }
  
  const element = document.getElementById('pdf-content');
  const opt = {
    margin:       0.5,
    filename:     'HealthCalc_BAC_Report.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
  };

  // Change background for PDF (so it looks good on paper)
  element.style.background = '#ffffff';
  element.style.color = '#000000';
  
  html2pdf().set(opt).from(element).save().then(() => {
    // Revert styles after generating
    element.style.background = 'transparent';
    element.style.color = 'inherit';
  });
}

function shareResult() {
  var bac = document.getElementById('bacResult').innerText;
  var text = `My estimated Blood Alcohol Content is ${bac}. Calculated on HealthCalc.in. Stay safe, never drink and drive!`;
  
  if (navigator.share) {
    navigator.share({ title: 'My BAC Result', text: text, url: window.location.href });
  } else {
    navigator.clipboard.writeText(text + ' ' + window.location.href);
    alert('✅ Result copied to clipboard!');
  }
}

function toggleTheme() {
  document.body.classList.toggle('dark');
  document.getElementById('themeIcon').className = document.body.classList.contains('dark') ? 'fas fa-sun' : 'fas fa-moon';
}

// Init
window.onload = function() { calculateBAC(); };
