<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Macro Calculator | Protein, Carbs & Fats Planner | AI Chat | HealthCalc</title>
<meta name="description" content="Calculate your optimal daily macronutrient intake for weight loss, maintenance, or muscle gain.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
  --primary: #f97316; --primary-hover: #ea580c; --primary-light: #ffedd5;
  --secondary: #3b82f6; --dark: #0f172a; --card-bg: #ffffff;
  --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
  --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #fff7ed 100%);
  --shadow-md: 0 8px 16px rgba(0,0,0,0.06); --radius-lg: 20px; --radius-xl: 28px;
  --transition: all 0.3s ease;
}
body.dark {
  --primary-light: #7c2d12; --card-bg: #1e293b; --text: #f8fafc; --text-muted: #94a3b8;
  --border: #334155; --bg-gradient: linear-gradient(135deg, #020617 0%, #0f172a 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--text); min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; padding: 20px; }
.top-nav { background: rgba(var(--card-bg), 0.8); backdrop-filter: blur(12px); padding: 16px 24px; border-radius: 100px; margin-bottom: 20px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 16px; z-index: 1000; }
.nav-links { display: flex; gap: 12px; }
.nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 14px; padding: 8px 20px; border-radius: 50px; }
.nav-links a.active { background: var(--primary); color: white; }
.theme-toggle-btn { background: var(--card-bg); border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 50%; color: var(--text); cursor: pointer; }
.hero { text-align: center; padding: 30px 20px; }
.hero h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; color: var(--primary); margin-bottom: 12px; }
.main-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; margin: 20px 0; }
@media(max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
.card { background: var(--card-bg); border-radius: var(--radius-xl); padding: 32px; box-shadow: var(--shadow-md); border: 1px solid var(--border); }
.input-group { margin-bottom: 16px; }
label { font-weight: 600; font-size: 14px; color: var(--text); display: block; margin-bottom: 8px; }
input, select { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; background: var(--card-bg); color: var(--text); outline: none; }
.calc-btn { background: var(--primary); color: white; border: none; padding: 16px; width: 100%; border-radius: 50px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
.result-box { background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: var(--radius-xl); padding: 24px; text-align: center; color: white; margin-bottom: 24px; }
.macro-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 20px; }
.macro-card { background: rgba(255,255,255,0.1); padding: 16px; border-radius: 16px; }
.macro-val { font-size: 24px; font-weight: 800; margin: 5px 0; }
.protein .macro-val { color: #f43f5e; }
.carbs .macro-val { color: #3b82f6; }
.fats .macro-val { color: #f59e0b; }
.ai-chat-panel { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card-bg); overflow: hidden; }
.ai-chat-header { background: var(--primary-light); color: var(--primary-hover); padding: 16px; font-weight: 700; }
.ai-chat-messages { height: 250px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.ai-message-bot { background: var(--border); padding: 10px 14px; border-radius: 12px; max-width: 85%; align-self: flex-start; }
.ai-message-user { background: var(--primary); color: white; padding: 10px 14px; border-radius: 12px; max-width: 85%; align-self: flex-end; }
.ai-chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
.ai-chat-input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 20px; }
.ai-chat-send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: white; border: none; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <nav class="top-nav">
    <div class="nav-links"><a href="index.html"><i class="fas fa-home"></i> Home</a><a href="macro-calculator.html" class="active">Macro Calculator</a></div>
    <button class="theme-toggle-btn" onclick="document.body.classList.toggle('dark')"><i class="fas fa-moon"></i></button>
  </nav>

  <header class="hero"><h1>Macro Calculator</h1><p>Optimize your daily intake of protein, carbs, and fats for your fitness goals.</p></header>

  <main class="main-grid">
    <div class="card">
      <div class="input-group"><label>Gender</label><select id="gender"><option value="male">Male</option><option value="female">Female</option></select></div>
      <div class="input-group"><label>Age</label><input type="number" id="age" value="30"></div>
      <div class="input-group"><label>Weight (kg)</label><input type="number" id="weight" value="70"></div>
      <div class="input-group"><label>Height (cm)</label><input type="number" id="height" value="175"></div>
      <div class="input-group"><label>Activity Level</label><select id="activity"><option value="1.2">Sedentary</option><option value="1.55" selected>Moderate</option><option value="1.725">Active</option></select></div>
      <div class="input-group"><label>Goal</label><select id="goal"><option value="cut">Weight Loss</option><option value="maintain" selected>Maintain</option><option value="bulk">Muscle Gain</option></select></div>
      <button class="calc-btn" onclick="calculateMacros()"><i class="fas fa-calculator"></i> Calculate Macros</button>
    </div>

    <div class="card">
      <div class="result-box">
        <div style="font-size:14px; opacity:0.8;">Daily Calories</div>
        <div style="font-size:48px; font-weight:900; color:var(--primary);" id="calResult">2000</div>
        <div class="macro-grid">
          <div class="macro-card protein"><div style="font-size:12px;">Protein</div><div class="macro-val" id="proResult">150g</div></div>
          <div class="macro-card carbs"><div style="font-size:12px;">Carbs</div><div class="macro-val" id="carbResult">200g</div></div>
          <div class="macro-card fats"><div style="font-size:12px;">Fats</div><div class="macro-val" id="fatResult">65g</div></div>
        </div>
      </div>

      <div class="ai-chat-panel">
        <div class="ai-chat-header"><i class="fas fa-robot"></i> Nutrition AI Coach</div>
        <div class="ai-chat-messages" id="aiChatMessages"><div class="ai-message-bot">Hi! I see your macros above. Ask me for high-protein meal ideas or diet adjustments!</div></div>
        <div class="ai-chat-input-row">
          <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="Ask for meal plans..." onkeypress="if(event.key==='Enter')sendAIMessage()">
          <button class="ai-chat-send-btn" onclick="sendAIMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  function calculateMacros() {
    let w = parseFloat(document.getElementById('weight').value), h = parseFloat(document.getElementById('height').value);
    let age = parseInt(document.getElementById('age').value), act = parseFloat(document.getElementById('activity').value);
    let gender = document.getElementById('gender').value, goal = document.getElementById('goal').value;
    
    if(!w || !h || !age) return;
    let bmr = (10 * w) + (6.25 * h) - (5 * age) + (gender === 'male' ? 5 : -161);
    let tdee = bmr * act;
    let targetCal = goal === 'cut' ? tdee - 500 : (goal === 'bulk' ? tdee + 300 : tdee);
    
    let pro = (targetCal * 0.3) / 4, fats = (targetCal * 0.35) / 9, carbs = (targetCal * 0.35) / 4;
    
    document.getElementById('calResult').innerText = Math.round(targetCal);
    document.getElementById('proResult').innerText = Math.round(pro) + 'g';
    document.getElementById('carbResult').innerText = Math.round(carbs) + 'g';
    document.getElementById('fatResult').innerText = Math.round(fats) + 'g';
  }
  window.onload = calculateMacros;

  async function sendAIMessage() {
    var input = document.getElementById('aiChatInput'), message = input.value.trim();
    if(!message) return;
    
    var md = document.getElementById('aiChatMessages');
    md.innerHTML += `<div class="ai-message-user">${message}</div>`;
    input.value = '';
    md.scrollTop = md.scrollHeight;

    let cal = document.getElementById('calResult').innerText;
    let promptContext = `[USER MACROS: ${cal} Cal, P:${document.getElementById('proResult').innerText}, C:${document.getElementById('carbResult').innerText}, F:${document.getElementById('fatResult').innerText}]\nAct as a Nutrition AI. Answer: ${message}`;

    try {
      var res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userMessage: promptContext }) });
      var data = await res.json();
      md.innerHTML += `<div class="ai-message-bot">${data.reply.replace(/\\n/g, '<br>')}</div>`;
      md.scrollTop = md.scrollHeight;
    } catch(e) {
      md.innerHTML += `<div class="ai-message-bot">❌ Connection error to Vercel API.</div>`;
    }
  }
</script>
</body>
</html>
