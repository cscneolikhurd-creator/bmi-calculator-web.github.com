<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Gain & Muscle Building Calculator | AI Coach | HealthCalc</title>
<meta name="description" content="Find your optimal caloric surplus for clean bulking and muscle growth. Includes AI coaching for healthy weight gain.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --primary: #10b981; --primary-light: #d1fae5; --bg: #f0fdf4; --card: #ffffff; --text: #1e293b; --border: #a7f3d0; }
body.dark { --primary-light: #064e3b; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
.container { max-width: 900px; margin: 0 auto; }
.card { background: var(--card); border-radius: 24px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
.hero { text-align: center; margin-bottom: 30px; }
.hero h1 { color: var(--primary); font-size: 32px; font-weight: 800; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
.input-group { margin-bottom: 15px; }
label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
input, select { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); outline: none; }
.btn { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 50px; font-weight: 800; cursor: pointer; margin-top: 10px; }
.result { text-align: center; padding: 20px; background: var(--primary-light); border-radius: 16px; margin-top: 20px; }
.cal-highlight { font-size: 36px; font-weight: 800; color: var(--primary); }
.macro-box { display: flex; justify-content: space-around; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); }
.ai-panel { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 20px; }
.ai-header { background: var(--primary); color: white; padding: 12px; font-weight: 600; }
.ai-msgs { height: 200px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.msg-bot { background: var(--border); padding: 10px; border-radius: 10px; max-width: 85%; align-self: flex-start; color: var(--text); }
.msg-user { background: var(--primary); color: white; padding: 10px; border-radius: 10px; max-width: 85%; align-self: flex-end; }
.ai-input { display: flex; border-top: 1px solid var(--border); }
.ai-input input { border: none; border-radius: 0; padding: 12px; flex: 1; background: var(--card); color: var(--text); outline: none;}
.ai-input button { background: var(--primary); color: white; border: none; padding: 0 20px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <button onclick="document.body.classList.toggle('dark')" style="position:absolute;top:20px;right:20px;padding:10px;border-radius:50%;border:none;">☀️/🌙</button>
  <div class="hero"><h1>Weight Gain Calculator</h1><p>Find your optimal caloric surplus for clean bulking and muscle growth.</p></div>

  <div class="grid">
    <div class="card">
      <div class="input-group"><label>Gender</label><select id="gender"><option value="male">Male</option><option value="female">Female</option></select></div>
      <div class="input-group"><label>Age</label><input type="number" id="age" value="25"></div>
      <div class="input-group"><label>Weight (kg)</label><input type="number" id="weight" value="65"></div>
      <div class="input-group"><label>Height (cm)</label><input type="number" id="height" value="175"></div>
      <div class="input-group"><label>Activity Level</label><select id="activity"><option value="1.2">Sedentary</option><option value="1.55" selected>Moderate Exercise</option><option value="1.725">Heavy Exercise</option></select></div>
      <div class="input-group"><label>Goal Rate</label><select id="rate"><option value="250">Mild Surplus (+0.25 kg/week)</option><option value="500" selected>Moderate Surplus (+0.5 kg/week)</option></select></div>
      <button class="btn" onclick="calcWeightGain()">Calculate Surplus Target</button>
    </div>

    <div class="card">
      <div class="result" id="resBox" style="display:none;">
        <div>Daily Target for Weight Gain</div>
        <div class="cal-highlight" id="calTarget">—</div>
        <div style="font-size:12px; opacity:0.8;">Maintenance (TDEE): <span id="tdeeVal"></span> kcal</div>
        <div class="macro-box">
          <div><strong style="color:#ef4444;" id="proVal"></strong><br><small>Protein</small></div>
          <div><strong style="color:#3b82f6;" id="carbVal"></strong><br><small>Carbs</small></div>
          <div><strong style="color:#f59e0b;" id="fatVal"></strong><br><small>Fats</small></div>
        </div>
      </div>

      <div class="ai-panel">
        <div class="ai-header"><i class="fas fa-robot"></i> Bulking AI Coach</div>
        <div class="ai-msgs" id="chatMsgs"><div class="msg-bot">Calculate your bulking calories above, then ask me for high-calorie meal plans or muscle-building tips!</div></div>
        <div class="ai-input">
          <input type="text" id="chatInput" placeholder="E.g., High calorie shake recipe?" onkeypress="if(event.key==='Enter')sendAI()">
          <button onclick="sendAI()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function calcWeightGain() {
    let w = parseFloat(document.getElementById('weight').value), h = parseFloat(document.getElementById('height').value);
    let age = parseInt(document.getElementById('age').value), act = parseFloat(document.getElementById('activity').value);
    let gender = document.getElementById('gender').value, surplus = parseInt(document.getElementById('rate').value);
    
    if(!w || !h || !age) return;
    let bmr = (10 * w) + (6.25 * h) - (5 * age) + (gender === 'male' ? 5 : -161);
    let tdee = bmr * act;
    let targetCal = Math.round(tdee + surplus);
    
    // Bulking Macros: Protein 2.2g/kg, Fats 1g/kg, Carbs fill the rest
    let pro = Math.round(w * 2.2);
    let fats = Math.round(w * 1.0);
    let carbs = Math.round((targetCal - (pro * 4) - (fats * 9)) / 4);

    document.getElementById('resBox').style.display = 'block';
    document.getElementById('tdeeVal').innerText = Math.round(tdee);
    document.getElementById('calTarget').innerText = targetCal + " kcal";
    document.getElementById('proVal').innerText = pro + "g";
    document.getElementById('carbVal').innerText = carbs + "g";
    document.getElementById('fatVal').innerText = fats + "g";
  }

  async function sendAI() {
    let input = document.getElementById('chatInput');
    let msg = input.value.trim();
    if(!msg) return;

    let md = document.getElementById('chatMsgs');
    md.innerHTML += `<div class="msg-user">${msg}</div>`;
    input.value = '';
    md.scrollTop = md.scrollHeight;

    let cal = document.getElementById('calTarget').innerText;
    let prompt = `[USER GOAL: Bulking / Weight Gain. Target: ${cal}]\nAct as a Bulking/Fitness AI. Provide high-calorie, clean eating advice. Answer: ${msg}`;

    try {
      var res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userMessage: prompt }) });
      var data = await res.json();
      md.innerHTML += `<div class="msg-bot">${data.reply.replace(/\\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
      md.scrollTop = md.scrollHeight;
    } catch(e) {
      md.innerHTML += `<div class="msg-bot">❌ Connection error to Vercel API. Make sure /api/chat is deployed.</div>`;
    }
  }
</script>
</body>
</html>
