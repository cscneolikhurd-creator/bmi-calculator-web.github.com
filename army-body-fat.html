<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army Body Fat Test | Military Tape Measure | AI Coach | HealthCalc</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --primary: #4d7c0f; --primary-light: #ecfccb; --bg: #f7fee7; --card: #ffffff; --text: #1e293b; --border: #bbf7d0; }
body.dark { --primary-light: #14532d; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
.container { max-width: 900px; margin: 0 auto; }
.card { background: var(--card); border-radius: 24px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
.hero { text-align: center; margin-bottom: 30px; }
.hero h1 { color: var(--primary); font-size: 32px; font-weight: 800; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
.input-group { margin-bottom: 15px; }
label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
input, select { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); outline: none; }
.btn { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 50px; font-weight: 800; cursor: pointer; margin-top: 10px; }
.result { text-align: center; padding: 20px; background: var(--primary-light); border-radius: 16px; margin-top: 20px; }
.fat-highlight { font-size: 42px; font-weight: 900; color: var(--primary); }
.ai-panel { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 20px; }
.ai-header { background: var(--primary); color: white; padding: 12px; font-weight: 600; }
.ai-msgs { height: 200px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.msg-bot { background: var(--border); padding: 10px; border-radius: 10px; max-width: 85%; align-self: flex-start; color: var(--text); }
.msg-user { background: var(--primary); color: white; padding: 10px; border-radius: 10px; max-width: 85%; align-self: flex-end; }
.ai-input { display: flex; border-top: 1px solid var(--border); }
.ai-input input { border: none; padding: 12px; flex: 1; background: var(--card); color: var(--text); outline: none;}
.ai-input button { background: var(--primary); color: white; border: none; padding: 0 20px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <button onclick="document.body.classList.toggle('dark')" style="position:absolute;top:20px;right:20px;padding:10px;border-radius:50%;border:none;">☀️/🌙</button>
  <div class="hero"><h1>Army Body Fat Test</h1><p>Calculate your body fat percentage using the official military tape measure method.</p></div>

  <div class="grid">
    <div class="card">
      <div class="input-group"><label>Gender</label><select id="gender" onchange="toggleHip()"><option value="male">Male</option><option value="female">Female</option></select></div>
      <div class="input-group"><label>Age</label><input type="number" id="age" value="25"></div>
      <div class="input-group"><label>Height (cm)</label><input type="number" id="height" value="175"></div>
      <div class="input-group"><label>Neck Circumference (cm)</label><input type="number" id="neck" value="38"></div>
      <div class="input-group"><label>Waist Circumference (cm)</label><input type="number" id="waist" value="85"></div>
      <div class="input-group" id="hipGroup" style="display:none;"><label>Hip Circumference (cm)</label><input type="number" id="hip" value="95"></div>
      <button class="btn" onclick="calcArmyFat()">Calculate Body Fat %</button>
    </div>

    <div class="card">
      <div class="result" id="resBox" style="display:none;">
        <div>Estimated Body Fat</div>
        <div class="fat-highlight" id="fatResult">—</div>
        <div style="margin-top:10px; font-weight:600;" id="standardCheck"></div>
      </div>

      <div class="ai-panel">
        <div class="ai-header"><i class="fas fa-robot"></i> Military Fitness Coach</div>
        <div class="ai-msgs" id="chatMsgs"><div class="msg-bot">Ask me how to prepare for a physical fitness test or reduce body fat!</div></div>
        <div class="ai-input">
          <input type="text" id="chatInput" placeholder="Ask a fitness question..." onkeypress="if(event.key==='Enter')sendAI()">
          <button onclick="sendAI()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleHip() {
    document.getElementById('hipGroup').style.display = document.getElementById('gender').value === 'female' ? 'block' : 'none';
  }

  function calcArmyFat() {
    let gender = document.getElementById('gender').value;
    let h = parseFloat(document.getElementById('height').value);
    let n = parseFloat(document.getElementById('neck').value);
    let w = parseFloat(document.getElementById('waist').value);
    let hip = parseFloat(document.getElementById('hip').value) || 0;
    
    if(!h || !n || !w) return;

    let bf = 0;
    if (gender === 'male') {
        // US Navy formula (metric)
        bf = 495 / (1.0324 - 0.19077 * Math.log10(w - n) + 0.15456 * Math.log10(h)) - 450;
    } else {
        bf = 495 / (1.29579 - 0.35004 * Math.log10(w + hip - n) + 0.22100 * Math.log10(h)) - 450;
    }

    if (isNaN(bf) || bf < 1 || bf > 70) { alert("Invalid measurements."); return; }

    document.getElementById('resBox').style.display = 'block';
    document.getElementById('fatResult').innerText = bf.toFixed(1) + "%";
    
    let standard = gender === 'male' ? 20 : 30; // Rough army standard
    if(bf > standard) {
        document.getElementById('standardCheck').innerHTML = `<span style="color:#ef4444;">Over typical military standard (${standard}%)</span>`;
    } else {
        document.getElementById('standardCheck').innerHTML = `<span style="color:#10b981;">Meets typical military standard (<${standard}%)</span>`;
    }
  }

  async function sendAI() {
    let input = document.getElementById('chatInput'), msg = input.value.trim();
    if(!msg) return;

    let md = document.getElementById('chatMsgs');
    md.innerHTML += `<div class="msg-user">${msg}</div>`;
    input.value = ''; md.scrollTop = md.scrollHeight;

    let fat = document.getElementById('fatResult').innerText;
    let prompt = `[USER GOAL: Military Fitness / Body Fat Reduction. Current BF: ${fat}]\nAct as a Military Fitness AI. Answer: ${msg}`;

    try {
      var res = await fetch('https://bmi-calculator-web-github-com.vercel.app/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userMessage: prompt }) });
      var data = await res.json();
      md.innerHTML += `<div class="msg-bot">${data.reply.replace(/\\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
      md.scrollTop = md.scrollHeight;
    } catch(e) {
      md.innerHTML += `<div class="msg-bot">❌ Connection error to Vercel API.</div>`;
    }
  }
</script>
</body>
</html>
