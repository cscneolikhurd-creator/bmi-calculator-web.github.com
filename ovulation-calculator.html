<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ovulation Calculator | Fertile Window Tracker | AI Chat | HealthCalc</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --primary: #ec4899; --primary-light: #fce7f3; --bg: #fdf2f8; --card: #ffffff; --text: #1e293b; --border: #fbcfe8; }
body.dark { --primary-light: #831843; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
.container { max-width: 900px; margin: 0 auto; }
.card { background: var(--card); border-radius: 24px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
.hero { text-align: center; margin-bottom: 30px; }
.hero h1 { color: var(--primary); font-size: 32px; font-weight: 800; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
.input-group { margin-bottom: 15px; }
label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); outline: none; }
.btn { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 50px; font-weight: 800; cursor: pointer; margin-top: 10px; }
.result { text-align: center; padding: 20px; background: var(--primary-light); border-radius: 16px; margin-top: 20px; }
.date-highlight { font-size: 28px; font-weight: 800; color: var(--primary); }
.ai-panel { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 20px; }
.ai-header { background: var(--primary); color: white; padding: 12px; font-weight: 600; }
.ai-msgs { height: 200px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.msg-bot { background: var(--border); padding: 10px; border-radius: 10px; max-width: 85%; align-self: flex-start; color: var(--text); }
.msg-user { background: var(--primary); color: white; padding: 10px; border-radius: 10px; max-width: 85%; align-self: flex-end; }
.ai-input { display: flex; border-top: 1px solid var(--border); }
.ai-input input { border: none; border-radius: 0; padding: 12px; flex: 1; }
.ai-input button { background: var(--primary); color: white; border: none; padding: 0 20px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <button onclick="document.body.classList.toggle('dark')" style="position:absolute;top:20px;right:20px;padding:10px;border-radius:50%;border:none;">☀️/🌙</button>
  <div class="hero"><h1>Ovulation Calculator</h1><p>Find your most fertile days to increase chances of conception.</p></div>

  <div class="grid">
    <div class="card">
      <div class="input-group"><label>First day of last period (LMP)</label><input type="date" id="lmp"></div>
      <div class="input-group"><label>Average Cycle Length (days)</label><input type="number" id="cycle" value="28"></div>
      <button class="btn" onclick="calcOvulation()">Calculate Fertility Window</button>
    </div>

    <div class="card">
      <div class="result" id="resBox" style="display:none;">
        <div>Expected Ovulation Date</div>
        <div class="date-highlight" id="ovuDate">—</div>
        <div style="margin-top:10px;font-size:14px;">Fertile Window: <strong id="fertWindow"></strong></div>
        <div style="margin-top:10px;font-size:14px;">Next Period: <strong id="nextPeriod"></strong></div>
      </div>

      <div class="ai-panel">
        <div class="ai-header"><i class="fas fa-robot"></i> Fertility AI Assistant</div>
        <div class="ai-msgs" id="chatMsgs"><div class="msg-bot">Calculate your dates above, then ask me about ovulation signs or conception tips!</div></div>
        <div class="ai-input">
          <input type="text" id="chatInput" placeholder="Ask a question..." onkeypress="if(event.key==='Enter')sendAI()">
          <button onclick="sendAI()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function formatDate(date) { return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

  function calcOvulation() {
    let lmpVal = document.getElementById('lmp').value;
    let cycle = parseInt(document.getElementById('cycle').value);
    if(!lmpVal || !cycle) return;

    let lmp = new Date(lmpVal);
    let nextPeriod = new Date(lmp);
    nextPeriod.setDate(lmp.getDate() + cycle);
    
    let ovulation = new Date(nextPeriod);
    ovulation.setDate(nextPeriod.getDate() - 14);

    let fertStart = new Date(ovulation); fertStart.setDate(ovulation.getDate() - 5);
    let fertEnd = new Date(ovulation); fertEnd.setDate(ovulation.getDate() + 1);

    document.getElementById('resBox').style.display = 'block';
    document.getElementById('ovuDate').innerText = formatDate(ovulation);
    document.getElementById('fertWindow').innerText = `${formatDate(fertStart)} - ${formatDate(fertEnd)}`;
    document.getElementById('nextPeriod').innerText = formatDate(nextPeriod);
  }

  async function sendAI() {
    let input = document.getElementById('chatInput');
    let msg = input.value.trim();
    if(!msg) return;

    let md = document.getElementById('chatMsgs');
    md.innerHTML += `<div class="msg-user">${msg}</div>`;
    input.value = '';
    md.scrollTop = md.scrollHeight;

    let ovu = document.getElementById('ovuDate').innerText;
    let prompt = `[USER PROFILE - Ovulation Date: ${ovu}]\nAct as a Women's Health AI. Answer: ${msg}`;

    try {
      var res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userMessage: prompt }) });
      var data = await res.json();
      md.innerHTML += `<div class="msg-bot">${data.reply.replace(/\\n/g, '<br>')}</div>`;
      md.scrollTop = md.scrollHeight;
    } catch(e) {
      md.innerHTML += `<div class="msg-bot">❌ Connection error to Vercel API.</div>`;
    }
  }
</script>
</body>
</html>
