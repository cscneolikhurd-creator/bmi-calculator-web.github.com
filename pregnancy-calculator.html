<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pregnancy Calculator | Due Date & Trimester Tracker | US/UK/CA/AU</title>
<meta name="description" content="Calculate due date, current week, trimester, and fetal development milestones. Follows ACOG, NHS, RANZCOG guidelines.">
<link rel="canonical" href="https://healthcalc.in/pregnancy-calculator.html">
<link rel="alternate" hreflang="en-us" href="https://healthcalc.in/pregnancy-calculator.html">
<link rel="alternate" hreflang="en-gb" href="https://healthcalc.in/pregnancy-calculator.html">
<link rel="alternate" hreflang="en-ca" href="https://healthcalc.in/pregnancy-calculator.html">
<link rel="alternate" hreflang="en-au" href="https://healthcalc.in/pregnancy-calculator.html">
<link rel="stylesheet" href="global.css">
<script src="global.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#ec4899,#f43f5e);min-height:100vh;padding:20px}.container{max-width:800px;margin:0 auto}.card{background:white;border-radius:32px;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.3)}h1{font-size:32px;background:linear-gradient(135deg,#ec4899,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent}.international-bar{display:flex;justify-content:flex-end;gap:15px;flex-wrap:wrap;margin-bottom:20px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.1)}.health-authority-note{background:#fce7f3;padding:6px 16px;border-radius:40px;font-size:0.8rem;display:inline-block;margin-bottom:15px}.input-group{margin-bottom:18px}label{display:block;font-weight:600;margin-bottom:6px;color:#333}input,select{width:100%;padding:12px 14px;border:2px solid #f1c0d0;border-radius:12px}.calc-btn{background:linear-gradient(135deg,#ec4899,#f43f5e);color:white;padding:14px;width:100%;border:none;border-radius:60px;font-weight:700;cursor:pointer;margin:16px 0}.result-box{background:#fdf2f8;border-radius:24px;padding:24px;text-align:center;margin-top:20px}.due-date{font-size:28px;font-weight:800;color:#db2777}.week-info{font-size:18px;margin:10px 0}.fetal-size{font-size:14px;color:#666}body.dark .card{background:#1e293b}body.dark label{color:#cbd5e1}body.dark input,body.dark select{background:#0f172a;border-color:#475569;color:#e2e8f0}body.dark .result-box{background:#0f172a}body.dark .due-date{color:#f472b6}
</style>
</head>
<body>
<div class="container">
<div class="international-bar"><select id="countrySelect"><option value="us">🇺🇸 US</option><option value="uk">🇬🇧 UK</option><option value="ca">🇨🇦 Canada</option><option value="au">🇦🇺 Australia</option></select><div class="theme-toggle"><button class="theme-option" data-theme="light">☀️</button><button class="theme-option" data-theme="dark">🌙</button></div><div class="language-switcher"><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="hi">हि</button></div></div>
<div id="healthAuthorityNote" class="health-authority-note">🤰 Based on ACOG/NHS guidelines – 40 weeks average gestation</div>
<div class="card">
<h1><i class="fas fa-baby-carriage"></i> Pregnancy Due Date Calculator</h1>
<div class="input-group"><label><i class="fas fa-calendar-alt"></i> First day of last menstrual period (LMP)</label><input type="date" id="lmp"></div>
<div class="input-group"><label><i class="fas fa-calendar-check"></i> Or known due date (optional)</label><input type="date" id="edd"></div>
<button class="calc-btn" onclick="calculatePregnancy()">Calculate Pregnancy Info</button>
<div class="result-box" id="result"><div class="due-date" id="dueDate">—</div><div class="week-info" id="weekInfo"></div><div id="trimester"></div><div id="fetalSize"></div></div>
</div></div>
<script>
function calculatePregnancy(){
let lmp = document.getElementById('lmp').value;
let eddInput = document.getElementById('edd').value;
let dueDate, today = new Date();
today.setHours(0,0,0,0);
if(eddInput){
dueDate = new Date(eddInput);
}else if(lmp){
dueDate = new Date(lmp);
dueDate.setDate(dueDate.getDate() + 280);
}else{ alert('Enter LMP or EDD'); return; }
let daysLeft = Math.ceil((dueDate - today)/(1000*60*60*24));
let weeksElapsed = Math.floor((280 - daysLeft)/7);
let trimester = weeksElapsed<13 ? 'First Trimester (Weeks 1-12)' : (weeksElapsed<27 ? 'Second Trimester (Weeks 13-26)' : 'Third Trimester (Weeks 27-40)');
let fetalSize = '';
if(weeksElapsed<=4) fetalSize='Poppy seed';
else if(weeksElapsed<=8) fetalSize='Raspberry';
else if(weeksElapsed<=12) fetalSize='Lime';
else if(weeksElapsed<=16) fetalSize='Avocado';
else if(weeksElapsed<=20) fetalSize='Mango';
else if(weeksElapsed<=24) fetalSize='Corn';
else if(weeksElapsed<=28) fetalSize='Eggplant';
else if(weeksElapsed<=32) fetalSize='Coconut';
else if(weeksElapsed<=36) fetalSize='Pineapple';
else fetalSize='Watermelon';
let weekStatus = weeksElapsed>=40 ? 'Full term' : `Week ${weeksElapsed} of pregnancy`;
document.getElementById('dueDate').innerHTML = dueDate.toDateString();
document.getElementById('weekInfo').innerHTML = weekStatus;
document.getElementById('trimester').innerHTML = trimester;
document.getElementById('fetalSize').innerHTML = `👶 Fetal size: ${fetalSize}`;
}
</script>
</body>
</html>
