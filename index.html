<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>स्वास्थ्य कैलकुलेटर संग्रह | HealthCalc.in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
            max-width: 700px;
            margin: 0 auto;
        }

        .stats-badge {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Grid for Calculators */
        .calculators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        /* Calculator Card */
        .calculator-card {
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .calculator-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .card-icon {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.8rem;
        }

        .card-header h2 {
            font-size: 1.4rem;
            color: #333;
            font-weight: 600;
        }

        .card-content {
            flex: 1;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #764ba2;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.3s;
            margin: 5px 0;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 10px;
        }

        .result-area {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            font-weight: 500;
            color: #333;
            border-left: 4px solid #764ba2;
            min-height: 50px;
        }

        .guide-section {
            margin-top: 15px;
            border-top: 2px dashed #e0e0e0;
            padding-top: 15px;
        }

        .guide-btn {
            background: white;
            color: #764ba2;
            border: 2px solid #764ba2;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .guide-btn:hover {
            background: #764ba2;
            color: white;
        }

        .guide-content {
            display: none;
            background: #f0f0ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #444;
            line-height: 1.6;
        }

        .guide-content.show {
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.8);
            padding: 20px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }
            .calculators-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h1>🏥 HealthCalc.in</h1>
            <p>Your Complete Health Calculator Suite - 9 Advanced Tools with Personalized Guides</p>
            <div class="stats-badge">
                <span class="badge">9+ Health Tools</span>
                <span class="badge">100% Free</span>
                <span class="badge">Privacy Protected</span>
                <span class="badge">Mobile Friendly</span>
            </div>
        </div>

        <!-- All Calculators Grid -->
        <div class="calculators-grid" id="calculatorsGrid">
            <!-- यहां JavaScript से सभी 9 कैलकुलेटर डायनामिक रूप से जुड़ेंगे -->
        </div>

        <footer>
            <p>© 2024 HealthCalc.in - All calculations happen in your browser. We don't store any data.</p>
        </footer>
    </div>

    <script>
        // सभी कैलकुलेटर का डेटा
        const calculators = [
            // 1. मौजूदा BMI कैलकुलेटर (अपग्रेडेड)
            {
                icon: "⚖️",
                title: "BMI कैलकुलेटर",
                inputs: [
                    { type: "number", label: "ऊंचाई (cm)", id: "bmiHeight", placeholder: "170", min: 50, max: 250 },
                    { type: "number", label: "वजन (kg)", id: "bmiWeight", placeholder: "70", min: 20, max: 300 }
                ],
                calculate: (inputs) => {
                    const h = parseFloat(inputs[0]) / 100;
                    const w = parseFloat(inputs[1]);
                    if (!h || !w || h < 0.5 || w < 20) return "कृपया सही ऊंचाई और वजन डालें";
                    const bmi = (w / (h * h)).toFixed(1);
                    let category = "";
                    if (bmi < 18.5) category = "कम वजन (Underweight)";
                    else if (bmi < 25) category = "सामान्य वजन (Normal)";
                    else if (bmi < 30) category = "अधिक वजन (Overweight)";
                    else category = "मोटापा (Obese)";
                    return `BMI: ${bmi} - ${category}`;
                },
                guide: "BMI गाइड: स्वस्थ BMI 18.5-24.9 के बीच होता है। अपने BMI के अनुसार डाइट और एक्सरसाइज प्लान बनाएं। PDF में पूरी गाइड डाउनलोड करें।"
            },
            // 2. मौजूदा Calorie कैलकुलेटर (अपग्रेडेड)
            {
                icon: "🔥",
                title: "कैलोरी कैलकुलेटर",
                inputs: [
                    { type: "number", label: "उम्र (साल)", id: "calAge", placeholder: "30", min: 15, max: 100 },
                    { type: "select", label: "लिंग", id: "calGender", options: ["पुरुष", "महिला"] },
                    { type: "number", label: "वजन (kg)", id: "calWeight", placeholder: "70", min: 20, max: 300 },
                    { type: "number", label: "ऊंचाई (cm)", id: "calHeight", placeholder: "170", min: 50, max: 250 },
                    { type: "select", label: "एक्टिविटी लेवल", id: "calActivity", options: ["बहुत कम (Sedentary)", "हल्का (Light)", "मध्यम (Moderate)", "अधिक (Active)", "बहुत अधिक (Very Active)"] }
                ],
                calculate: (inputs) => {
                    const age = parseFloat(inputs[0]);
                    const gender = inputs[1];
                    const weight = parseFloat(inputs[2]);
                    const height = parseFloat(inputs[3]);
                    const activity = inputs[4];
                    
                    if (!age || !weight || !height) return "सभी फील्ड भरें";
                    
                    let bmr;
                    if (gender === "पुरुष") {
                        bmr = 10 * weight + 6.25 * height - 5 * age + 5;
                    } else {
                        bmr = 10 * weight + 6.25 * height - 5 * age - 161;
                    }
                    
                    const activityMultiplier = {
                        "बहुत कम (Sedentary)": 1.2,
                        "हल्का (Light)": 1.375,
                        "मध्यम (Moderate)": 1.55,
                        "अधिक (Active)": 1.725,
                        "बहुत अधिक (Very Active)": 1.9
                    };
                    
                    const calories = Math.round(bmr * (activityMultiplier[activity] || 1.2));
                    return `दैनिक कैलोरी जरूरत: ${calories} kcal`;
                },
                guide: "कैलोरी गाइड: वजन घटाने के लिए 500 कैलोरी कम खाएं, बढ़ाने के लिए 500 अधिक। प्रोटीन, फैट और कार्ब्स का सही अनुपात जानें।"
            },
            // 3. मौजूदा Body Fat कैलकुलेटर (सिंपल वर्जन)
            {
                icon: "🧬",
                title: "बॉडी फैट % (अनुमानित)",
                inputs: [
                    { type: "number", label: "उम्र (साल)", id: "bfAge", placeholder: "30", min: 15, max: 100 },
                    { type: "select", label: "लिंग", id: "bfGender", options: ["पुरुष", "महिला"] },
                    { type: "number", label: "BMI", id: "bfBmi", placeholder: "24", min: 10, max: 50 }
                ],
                calculate: (inputs) => {
                    const age = parseFloat(inputs[0]);
                    const gender = inputs[1];
                    const bmi = parseFloat(inputs[2]);
                    
                    if (!age || !bmi) return "सभी फील्ड भरें";
                    
                    let bodyFat;
                    if (gender === "पुरुष") {
                        bodyFat = (1.20 * bmi) + (0.23 * age) - 16.2;
                    } else {
                        bodyFat = (1.20 * bmi) + (0.23 * age) - 5.4;
                    }
                    
                    bodyFat = Math.max(5, Math.min(50, bodyFat)).toFixed(1);
                    return `अनुमानित बॉडी फैट: ${bodyFat}%`;
                },
                guide: "बॉडी फैट गाइड: पुरुषों के लिए 6-24%, महिलाओं के लिए 16-30% स्वस्थ माना जाता है। फैट कम करने के टिप्स जानें।"
            },
            // 4. मौजूदा Water Intake कैलकुलेटर
            {
                icon: "💧",
                title: "पानी कैलकुलेटर",
                inputs: [
                    { type: "number", label: "वजन (kg)", id: "waterWeight", placeholder: "70", min: 20, max: 300 },
                    { type: "select", label: "एक्टिविटी", id: "waterActivity", options: ["बहुत कम", "हल्का पसीना", "अधिक पसीना (वर्कआउट)"] },
                    { type: "select", label: "मौसम", id: "waterClimate", options: ["सामान्य", "गर्म/शुष्क"] }
                ],
                calculate: (inputs) => {
                    const weight = parseFloat(inputs[0]);
                    const activity = inputs[1];
                    const climate = inputs[2];
                    
                    if (!weight) return "वजन डालें";
                    
                    let water = weight * 0.033; // base in liters
                    
                    if (activity === "हल्का पसीना") water += 0.3;
                    else if (activity === "अधिक पसीना (वर्कआउट)") water += 0.7;
                    
                    if (climate === "गर्म/शुष्क") water += 0.5;
                    
                    return `रोजाना पिएं: ${water.toFixed(1)} लीटर (लगभग ${Math.round(water * 4.2)} गिलास)`;
                },
                guide: "पानी गाइड: सुबह उठते ही 2 गिलास पानी पिएं। खाने से 30 मिनट पहले पानी पीने से वजन कम होता है।"
            },
            // 5. नया: मेटाबोलिक हेल्थ कैलकुलेटर
            {
                icon: "⚡",
                title: "मेटाबॉलिक एज",
                inputs: [
                    { type: "number", label: "वास्तविक उम्र", id: "metaAge", placeholder: "35", min: 15, max: 100 },
                    { type: "number", label: "कमर (cm)", id: "metaWaist", placeholder: "85", min: 50, max: 200 },
                    { type: "number", label: "BMI", id: "metaBmi", placeholder: "27", min: 10, max: 50 }
                ],
                calculate: (inputs) => {
                    const realAge = parseFloat(inputs[0]);
                    const waist = parseFloat(inputs[1]);
                    const bmi = parseFloat(inputs[2]);
                    
                    if (!realAge || !waist || !bmi) return "सभी फील्ड भरें";
                    
                    let metabolicAge = realAge;
                    
                    if (waist > 90) metabolicAge += 5;
                    else if (waist < 75) metabolicAge -= 3;
                    
                    if (bmi > 28) metabolicAge += 4;
                    else if (bmi < 22) metabolicAge -= 2;
                    
                    metabolicAge = Math.round(metabolicAge);
                    
                    let status = metabolicAge > realAge ? "अधिक (जोखिम)" : (metabolicAge < realAge ? "कम (बेहतर)" : "बराबर");
                    
                    return `मेटाबॉलिक एज: ${metabolicAge} साल (${status})`;
                },
                guide: "मेटाबॉलिक एज गाइड: मेटाबॉलिज्म तेज करने के 10 तरीके - स्ट्रेंथ ट्रेनिंग, प्रोटीन डाइट, नींद पूरी लें। PDF डाउनलोड करें।"
            },
            // 6. नया: मेंस्ट्रुअल साइकिल कैलकुलेटर
            {
                icon: "🌸",
                title: "मेंस्ट्रुअल साइकिल",
                inputs: [
                    { type: "number", label: "पिछली पीरियड तारीख (दिनांक, 1-31)", id: "periodLast", placeholder: "5", min: 1, max: 31 },
                    { type: "number", label: "साइकिल लंबाई (दिन)", id: "cycleLength", placeholder: "28", min: 21, max: 40 },
                    { type: "number", label: "पीरियड लंबाई (दिन)", id: "periodLength", placeholder: "5", min: 2, max: 10 }
                ],
                calculate: (inputs) => {
                    const lastDate = parseInt(inputs[0]);
                    const cycle = parseInt(inputs[1]);
                    const periodLen = parseInt(inputs[2]);
                    
                    if (!lastDate || !cycle || !periodLen) return "सभी फील्ड भरें";
                    
                    const nextPeriod = lastDate + cycle;
                    const ovulationDay = lastDate + (cycle - 14);
                    const fertileStart = ovulationDay - 5;
                    const fertileEnd = ovulationDay + 1;
                    
                    let nextPeriodDisplay = nextPeriod > 30 ? nextPeriod - 30 : nextPeriod;
                    
                    return `अगला पीरियड: ~${nextPeriodDisplay} तारीख\nओवुलेशन: ~${ovulationDay > 30 ? ovulationDay - 30 : ovulationDay} तारीख\nफर्टाइल विंडो: दिन ${fertileStart > 30 ? fertileStart - 30 : fertileStart} - ${fertileEnd > 30 ? fertileEnd - 30 : fertileEnd}`;
                },
                guide: "मेंस्ट्रुअल हेल्थ गाइड: साइकिल के हर चरण में खानपान और एक्सरसाइज टिप्स। PMS कम करने के उपाय। PDF डाउनलोड करें।"
            },
            // 7. नया: स्लीप डेब्ट कैलकुलेटर
            {
                icon: "😴",
                title: "स्लीप डेब्ट",
                inputs: [
                    { type: "number", label: "उम्र (साल)", id: "sleepAge", placeholder: "30", min: 15, max: 100 },
                    { type: "number", label: "रोजाना सोए घंटे", id: "sleepHours", placeholder: "6", min: 2, max: 15 },
                    { type: "number", label: "पिछले 7 दिनों में कितनी रात कम सोए?", id: "sleepDays", placeholder: "4", min: 0, max: 7 }
                ],
                calculate: (inputs) => {
                    const age = parseFloat(inputs[0]);
                    const slept = parseFloat(inputs[1]);
                    const badDays = parseFloat(inputs[2]);
                    
                    let required = 7;
                    if (age < 18) required = 9;
                    else if (age < 30) required = 8;
                    else if (age < 60) required = 7.5;
                    else required = 7;
                    
                    const dailyDebt = required - slept;
                    const totalDebt = dailyDebt * badDays;
                    
                    if (totalDebt <= 0) return "बढ़िया! आप पर कोई नींद का कर्ज नहीं है।";
                    return `नींद का कर्ज: ${totalDebt.toFixed(1)} घंटे। इसे पूरा करने में ${Math.ceil(totalDebt / 1.5)} दिन लगेंगे।`;
                },
                guide: "स्लीप गाइड: 5 दिन में स्लीप डेब्ट कम करने की आदतें - स्क्रीन टाइम कम करें, कैफीन सीमित करें, सोने का रूटीन बनाएं।"
            },
            // 8. नया: MET एक्टिविटी कैलकुलेटर
            {
                icon: "🏃",
                title: "एक्टिविटी कैलोरी बर्न",
                inputs: [
                    { type: "number", label: "वजन (kg)", id: "metWeight", placeholder: "70", min: 20, max: 300 },
                    { type: "select", label: "एक्टिविटी", id: "metActivity", options: ["तेज चलना (5 km/h)", "दौड़ना (8 km/h)", "साइकिलिंग", "योग", "वेट ट्रेनिंग", "तैराकी"] },
                    { type: "number", label: "समय (मिनट)", id: "metTime", placeholder: "30", min: 1, max: 480 }
                ],
                calculate: (inputs) => {
                    const weight = parseFloat(inputs[0]);
                    const activity = inputs[1];
                    const minutes = parseFloat(inputs[2]);
                    
                    if (!weight || !minutes) return "सभी फील्ड भरें";
                    
                    const metValues = {
                        "तेज चलना (5 km/h)": 4.3,
                        "दौड़ना (8 km/h)": 8.0,
                        "साइकिलिंग": 6.0,
                        "योग": 2.5,
                        "वेट ट्रेनिंग": 3.5,
                        "तैराकी": 5.8
                    };
                    
                    const met = metValues[activity] || 4.0;
                    const caloriesBurned = (met * 3.5 * weight / 200) * minutes;
                    
                    return `कैलोरी बर्न: ${Math.round(caloriesBurned)} kcal (MET: ${met})`;
                },
                guide: "MET गाइड: अलग-अलग एक्टिविटीज के MET वैल्यू और ज्यादा कैलोरी बर्न करने के टिप्स। PDF डाउनलोड करें।"
            },
            // 9. नया: हार्ट रेट जोन कैलकुलेटर
            {
                icon: "❤️",
                title: "हार्ट रेट जोन",
                inputs: [
                    { type: "number", label: "उम्र (साल)", id: "hrAge", placeholder: "35", min: 15, max: 100 },
                    { type: "number", label: "रेस्टिंग हार्ट रेट", id: "hrResting", placeholder: "70", min: 40, max: 120 }
                ],
                calculate: (inputs) => {
                    const age = parseFloat(inputs[0]);
                    const resting = parseFloat(inputs[1]);
                    
                    if (!age || !resting) return "सभी फील्ड भरें";
                    
                    const maxHR = 220 - age;
                    const reserveHR = maxHR - resting;
                    
                    const zone1_low = Math.round(resting + reserveHR * 0.5);
                    const zone1_high = Math.round(resting + reserveHR * 0.6);
                    
                    const zone2_low = Math.round(resting + reserveHR * 0.6);
                    const zone2_high = Math.round(resting + reserveHR * 0.7);
                    
                    const zone3_low = Math.round(resting + reserveHR * 0.7);
                    const zone3_high = Math.round(resting + reserveHR * 0.8);
                    
                    const zone4_low = Math.round(resting + reserveHR * 0.8);
                    const zone4_high = Math.round(resting + reserveHR * 0.93);
                    
                    return `जोन 2 (फैट बर्न): ${zone2_low}-${zone2_high}\nजोन 3 (कार्डियो): ${zone3_low}-${zone3_high}\nजोन 4 (पीक): ${zone4_low}-${zone4_high}`;
                },
                guide: "हार्ट रेट गाइड: फैट बर्न के लिए जोन 2 में एक्सरसाइज करें। अपनी हार्ट रेट मॉनिटर कैसे करें? PDF डाउनलोड करें।"
            }
        ];

        // सभी कैलकुलेटर को HTML में रेंडर करना
        const grid = document.getElementById('calculatorsGrid');
        
        calculators.forEach((calc, index) => {
            const card = document.createElement('div');
            card.className = 'calculator-card';
            
            // हेडर
            let html = `
                <div class="card-header">
                    <div class="card-icon">${calc.icon}</div>
                    <h2>${calc.title}</h2>
                </div>
                <div class="card-content" id="calc-${index}">
            `;
            
            // इनपुट फील्ड
            calc.inputs.forEach(input => {
                if (input.type === 'select') {
                    html += `<div class="input-group"><label>${input.label}</label><select id="${input.id}">`;
                    input.options.forEach(opt => {
                        html += `<option value="${opt}">${opt}</option>`;
                    });
                    html += `</select></div>`;
                } else {
                    html += `<div class="input-group"><label>${input.label}</label><input type="number" id="${input.id}" placeholder="${input.placeholder || ''}" min="${input.min || 0}" max="${input.max || 500}"></div>`;
                }
            });
            
            // बटन और रिजल्ट एरिया
            html += `
                <button class="btn" onclick="calculateTool(${index})">गणना करें</button>
                <div class="result-area" id="result-${index}">परिणाम यहां दिखेगा</div>
                <div class="guide-section">
                    <button class="guide-btn" onclick="toggleGuide(${index})">
                        📥 मुफ्त PDF गाइड डाउनलोड करें
                    </button>
                    <div class="guide-content" id="guide-${index}">
                        ${calc.guide}
                        <br><br>
                        <button class="btn btn-secondary" onclick="downloadGuide(${index})">📄 PDF डाउनलोड करें</button>
                    </div>
                </div>
            `;
            
            html += `</div>`;
            card.innerHTML = html;
            grid.appendChild(card);
        });

        // ग्लोबल फंक्शन्स
        window.calculators = calculators;

        window.calculateTool = (index) => {
            const calc = calculators[index];
            const inputValues = [];
            
            calc.inputs.forEach(input => {
                const element = document.getElementById(input.id);
                if (element) {
                    inputValues.push(element.value);
                }
            });
            
            const result = calc.calculate(inputValues);
            document.getElementById(`result-${index}`).innerText = result;
        };

        window.toggleGuide = (index) => {
            const guide = document.getElementById(`guide-${index}`);
            guide.classList.toggle('show');
        };

        window.downloadGuide = (index) => {
            const calc = calculators[index];
            const guideText = calc.guide;
            
            // PDF जैसा टेक्स्ट फाइल बनाएंगे (सिंपल टेक्स्ट)
            const content = `HealthCalc.in - ${calc.title}\n\nगाइड:\n${guideText}\n\n---\nwww.healthcalc.in पर और टूल्स देखें।`;
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${calc.title.replace(/\s+/g, '_')}_Guide.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
