<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="google-site-verification" content="0IEZPyTwWA5T34zV_F9iwPc5RxK8f8HwZ91Cx7zzyQo" />
<title>Ideal Weight Calculator | Peterson Formula | US/UK/CA/AU | HealthCalc</title>
<meta name="description" content="Advanced ideal weight calculator using Peterson formula. Shows healthy weight range based on height, gender, and body frame. Follows CDC, NHS, Health Canada guidelines. Free & private.">
<meta name="keywords" content="ideal weight calculator, healthy weight range, Peterson formula, body frame size, ideal weight for height, US, UK, Canada, Australia">
<link rel="canonical" href="https://healthcalc.in/ideal-weight-calculator.html">
<link rel="alternate" hreflang="en-us" href="https://healthcalc.in/ideal-weight-calculator.html">
<link rel="alternate" hreflang="en-gb" href="https://healthcalc.in/ideal-weight-calculator.html">
<link rel="alternate" hreflang="en-ca" href="https://healthcalc.in/ideal-weight-calculator.html">
<link rel="alternate" hreflang="en-au" href="https://healthcalc.in/ideal-weight-calculator.html">
<link rel="stylesheet" href="global.css">
<script src="global.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
.card { background: white; border-radius: 32px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); }
h1 { font-size: 32px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.subtitle { color: var(--gray-600); margin-bottom: 24px; border-left: 3px solid #667eea; padding-left: 16px; font-size: 14px; }
.international-bar { display: flex; justify-content: flex-end; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
.health-authority-note { background: #eef2ff; padding: 6px 16px; border-radius: 40px; font-size: 0.8rem; text-align: center; display: inline-block; margin-bottom: 15px; }
.unit-toggle { display: flex; gap: 12px; background: #e0e4ff; padding: 5px; border-radius: 60px; margin-bottom: 20px; }
.unit-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 50px; font-weight: 600; cursor: pointer; }
.unit-btn.active { background: white; color: #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.input-group { margin-bottom: 18px; }
label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
input, select { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px; }
.calc-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px; width: 100%; border: none; border-radius: 60px; font-weight: 700; cursor: pointer; margin: 16px 0; }
.result-box { background: #f0fff4; border-radius: 24px; padding: 24px; text-align: center; margin-top: 20px; }
.ideal-weight { font-size: 48px; font-weight: 800; color: #27ae60; }
.range { font-size: 18px; color: #555; margin: 10px 0; }
/* Dark mode overrides - global.js adds class 'dark' */
body.dark .card { background: #1e293b; }
body.dark .input-group label { color: #cbd5e1; }
body.dark input, body.dark select { background: #0f172a; border-color: #334155; color: #e2e8f0; }
body.dark .result-box { background: #0f172a; color: #e2e8f0; }
body.dark .ideal-weight { color: #60a5fa; }
body.dark .health-authority-note { background: #1e293b; color: #94a3b8; }
</style>
</head>
<body>
<div class="container">
<div class="international-bar">
    <select id="countrySelect"><option value="us">🇺🇸 US</option><option value="uk">🇬🇧 UK</option><option value="ca">🇨🇦 Canada</option><option value="au">🇦🇺 Australia</option></select>
    <div class="theme-toggle"><button class="theme-option" data-theme="light">☀️</button><button class="theme-option" data-theme="dark">🌙</button></div>
    <div class="language-switcher"><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="hi">हि</button></div>
</div>
<div id="healthAuthorityNote" class="health-authority-note">📋 Based on CDC/NHS guidelines – Healthy BMI 18.5–24.9</div>
<div class="card">
<h1><i class="fas fa-weight-scale"></i> Ideal Weight Calculator</h1>
<div class="subtitle">Peterson formula & healthy weight range based on height, gender & body frame</div>
<div class="unit-toggle"><button class="unit-btn active" data-unit="metric" onclick="setUnit('metric')">📏 Metric (cm/kg)</button><button class="unit-btn" data-unit="imperial" onclick="setUnit('imperial')">🇺🇸 Imperial (in/lbs)</button></div>
<div class="input-group"><label><i class="fas fa-venus-mars"></i> Gender</label><select id="gender"><option value="female">Female</option><option value="male">Male</option></select></div>
<div class="input-group"><label><i class="fas fa-arrows-up-down"></i> Height</label><input type="number" id="height" value="170" step="0.1"><span id="heightUnitLabel" style="display:inline-block; margin-left:8px;">cm</span></div>
<div class="input-group"><label><i class="fas fa-hand-peace"></i> Body Frame</label><select id="frame"><option value="small">Small frame</option><option value="medium" selected>Medium frame</option><option value="large">Large frame</option></select></div>
<button class="calc-btn" onclick="calculateIdealWeight()"><i class="fas fa-calculator"></i> Calculate Ideal Weight</button>
<div class="result-box" id="resultBox"><div class="ideal-weight" id="idealWeight">—</div><div class="range" id="healthyRange"></div><div id="recommendation" style="margin-top:12px;"></div></div>
</div></div>
<script>
let currentUnit = 'metric';
function setUnit(unit) { currentUnit = unit; document.querySelectorAll('.unit-btn').forEach(b=>b.classList.toggle('active',b.dataset.unit===unit)); const heightUnit = document.getElementById('heightUnitLabel'); heightUnit.innerText = unit==='metric'?'cm':'in'; calculateIdealWeight(); }
function calculateIdealWeight() { let gender = document.getElementById('gender').value; let frame = document.getElementById('frame').value; let heightValue = parseFloat(document.getElementById('height').value); if (isNaN(heightValue)) return; let heightCm = currentUnit==='metric' ? heightValue : heightValue * 2.54; let ideal; let minBMI=18.5, maxBMI=24.9; let minWeight = (minBMI * Math.pow(heightCm/100,2)).toFixed(1); let maxWeight = (maxBMI * Math.pow(heightCm/100,2)).toFixed(1); if(gender==='male') ideal = 50 + 0.91*(heightCm-152.4); else ideal = 45.5 + 0.91*(heightCm-152.4); if(frame==='small') ideal *= 0.95; else if(frame==='large') ideal *= 1.05; ideal = Math.round(ideal*10)/10; let unitLabel = currentUnit==='metric'?'kg':'lbs'; let idealDisplay = currentUnit==='metric' ? ideal : (ideal * 2.20462).toFixed(1); let minDisplay = currentUnit==='metric' ? minWeight : (minWeight*2.20462).toFixed(1); let maxDisplay = currentUnit==='metric' ? maxWeight : (maxWeight*2.20462).toFixed(1); document.getElementById('idealWeight').innerHTML = idealDisplay + ' ' + unitLabel; document.getElementById('healthyRange').innerHTML = `Healthy weight range: ${minDisplay} – ${maxDisplay} ${unitLabel}`; let advice = idealDisplay > maxDisplay ? '⚠️ Your ideal weight is above healthy range. Focus on balanced diet.' : (idealDisplay < minDisplay ? '⚠️ Your ideal weight is below healthy range. Ensure adequate nutrition.' : '✅ Your ideal weight is within healthy range. Maintain with regular exercise.'); document.getElementById('recommendation').innerHTML = advice; }
window.onload = calculateIdealWeight;
</script>
</body>
</html>
