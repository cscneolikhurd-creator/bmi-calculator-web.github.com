<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponderal Index Calculator | Better than BMI | AI Coach | HealthCalc</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --primary: #0891b2; --primary-light: #ccfbf1; --bg: #f0fdfa; --card: #ffffff; --text: #1e293b; --border: #99f6e4; }
body.dark { --primary-light: #115e59; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
.container { max-width: 900px; margin: 0 auto; }
.card { background: var(--card); border-radius: 24px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
.hero { text-align: center; margin-bottom: 30px; }
.hero h1 { color: var(--primary); font-size: 32px; font-weight: 800; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
.input-group { margin-bottom: 15px; }
label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); outline: none; }
.btn { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 50px; font-weight: 800; cursor: pointer; margin-top: 10px; }
.result { text-align: center; padding: 20px; background: var(--primary-light); border-radius: 16px; margin-top: 20px; }
.pi-highlight { font-size: 42px; font-weight: 900; color: var(--primary); }
.ai-panel { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 20px; }
.ai-header { background: var(--primary); color: white; padding: 12px; font-weight: 600; }
.ai-msgs { height: 200px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.msg-bot { background: var(--border); padding: 10px; border-radius: 10px; max-width: 85%; align-self: flex-start; color: var(--text); }
.msg-user { background: var(--primary); color: white; padding: 10px; border-radius: 10px; max-width: 85%; align-self: flex-end; }
.ai-input { display: flex; border-top: 1px solid var(--border); }
.ai-input input { border: none; padding: 12px; flex: 1; background: var(--card); color: var(--text); outline: none;}
.ai-input button { background: var(--primary); color: white; border: none; padding: 0 20px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <button onclick="document.body.classList.toggle('dark')" style="position:absolute;top:20px;right:20px;padding:10px;border-radius:50%;border:none;">☀️/🌙</button>
  <div class="hero"><h1>Ponderal Index</h1><p>An alternative to BMI that better evaluates tall or short individuals.</p></div>

  <div class="grid">
    <div class="card">
      <div class="input-group"><label>Weight (kg)</label><input type="number" id="weight" value="70"></div>
      <div class="input-group"><label>Height (cm)</label><input type="number" id="height" value="175"></div>
      <button class="btn" onclick="calcPI()">Calculate Ponderal Index</button>
    </div>

    <div class="card">
      <div class="result" id="resBox" style="display:none;">
        <div>Your Ponderal Index (PI)</div>
        <div class="pi-highlight" id="piResult">—</div>
        <div style="margin-top:10px; font-weight:600;" id="piCategory"></div>
      </div>

      <div class="ai-panel">
        <div class="ai-header"><i class="fas fa-robot"></i> Body Composition AI</div>
        <div class="ai-msgs" id="chatMsgs"><div class="msg-bot">I can explain why PI is better than BMI for your height. Ask me anything!</div></div>
        <div class="ai-input">
          <input type="text" id="chatInput" placeholder="Ask about body composition..." onkeypress="if(event.key==='Enter')sendAI()">
          <button onclick="sendAI()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function calcPI() {
    let w = parseFloat(document.getElementById('weight').value);
    let hCm = parseFloat(document.getElementById('height').value);
    if(!w || !hCm) return;

    let hM = hCm / 100;
    let pi = w / Math.pow(hM, 3); // Formula: kg / m^3

    document.getElementById('resBox').style.display = 'block';
    document.getElementById('piResult').innerText = pi.toFixed(2);
    
    let cat = '';
    if (pi < 11) cat = '<span style="color:#3b82f6;">Underweight</span>';
    else if (pi >= 11 && pi <= 14) cat = '<span style="color:#10b981;">Normal / Healthy</span>';
    else cat = '<span style="color:#ef4444;">Overweight / Obese</span>';
    
    document.getElementById('piCategory').innerHTML = cat;
  }

  async function sendAI() {
    let input = document.getElementById('chatInput'), msg = input.value.trim();
    if(!msg) return;

    let md = document.getElementById('chatMsgs');
    md.innerHTML += `<div class="msg-user">${msg}</div>`;
    input.value = ''; md.scrollTop = md.scrollHeight;

    let pi = document.getElementById('piResult').innerText;
    let prompt = `[USER GOAL: Body Composition. Ponderal Index: ${pi}]\nAct as a Health AI. Answer: ${msg}`;

    try {
      var res = await fetch('https://bmi-calculator-web-github-com.vercel.app/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userMessage: prompt }) });
      var data = await res.json();
      md.innerHTML += `<div class="msg-bot">${data.reply.replace(/\\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
      md.scrollTop = md.scrollHeight;
    } catch(e) {
      md.innerHTML += `<div class="msg-bot">❌ Connection error to Vercel API.</div>`;
    }
  }
</script>
</body>
</html>
